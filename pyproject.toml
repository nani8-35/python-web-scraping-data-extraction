[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scraping-system"
version = "1.0.0"
description = "Typed demo-site data extraction with Scrapy, Selenium, and run reporting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Scrapy>=2.19,<3", "selenium>=4.28,<5", "beautifulsoup4>=4.12,<5",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "typer>=0.15,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
scraping-system = "scraping_system.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in tests requiring network or services"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
